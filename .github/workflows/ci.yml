name: CI – Continuous Integration

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

#  SOLUCIÓN 1: Permisos necesarios para que CodeQL pueda subir sus reportes
permissions:
  security-events: write
  actions: read
  contents: read

env:
  REGISTRY_NAME: stockyacr
  IMAGE_NAME: stocky-backend
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------
  # 1️⃣  Build, Unit Tests & CodeQL (SAST)
  # ---------------------------------------------------------
  build-test:
    name: Build & CodeQL Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      #  SOLUCIÓN 2: Envolver la compilación con CodeQL
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Compile & run tests
        run: mvn -B verify               # CodeQL espía este proceso en vivo

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

      # ---------------------------------------------------------
      # Snyk: Software Composition Analysis (SCA) para Maven
      # ---------------------------------------------------------
      - name: Snyk Dependency Scan (SCA)
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Export built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: stocky-jar
          path: target/*.jar

  # ---------------------------------------------------------
  # 2️⃣  Build Docker image, Grype Scan & Push to ACR
  # ---------------------------------------------------------
  docker-build:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      #  SOLUCIÓN 3: Construir la imagen localmente PRIMERO
      - name: Build Docker image (runtime stage)
        run: |
          docker build \
            --target runtime \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      #  SOLUCIÓN 4: Escanear la imagen YA construida (Grype)
      - name: Anchore Scan (Grype)
        uses: anchore/scan-action@v6
        with:
          image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fail-build: false

      # NOTA DEVSECOPS: Si Grype falla, el pipeline aborta acá. 
      # El código vulnerable JAMÁS llega a los siguientes pasos de Login y Push.

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Export image tag as artifact (for CD)
        run: echo "${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" > image-tag.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.txt