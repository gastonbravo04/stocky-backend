name: CD – Continuous Deployment

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  REGISTRY_NAME: stockyacr
  IMAGE_NAME: stocky-backend
  AZURE_WEBAPP_NAME: stocky-backend
  AZURE_RESOURCE_GROUP: stocky-rg

jobs:
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target container image
        id: img
        run: |
          SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          if [ -z "$SERVER" ]; then
            SERVER="${{ env.REGISTRY_NAME }}.azurecr.io"
          fi
          IMAGE_TAG="${SERVER}/${{ env.IMAGE_NAME }}:latest"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Target deployment image: $IMAGE_TAG"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set container image on App Service
        run: |
          az webapp config container set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ steps.img.outputs.image }}

      - name: Show deployment info
        run: |
          echo "Deployed image: ${{ steps.img.outputs.image }}"
          az webapp show -g ${{ env.AZURE_RESOURCE_GROUP }} -n ${{ env.AZURE_WEBAPP_NAME }} --query state -o tsv
