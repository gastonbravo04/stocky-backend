name: CD – Continuous Deployment

on:
  workflow_run:
    workflows: ["CI – Continuous Integration"]
    branches: [master]
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  REGISTRY_NAME: stockyacr
  IMAGE_NAME: stocky-backend
  AZURE_WEBAPP_NAME: stocky-backend
  AZURE_RESOURCE_GROUP: stocky-rg

jobs:
  verify-ci:
    name: Verify CI result
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI Verification
        run: echo "CI check passed, proceeding with continuous deployment"

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: verify-ci
    steps:
      - name: Resolve target container image
        id: img
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$COMMIT_SHA" ]; then
            COMMIT_SHA="${{ github.sha }}"
          fi
          SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
          if [ -z "$SERVER" ]; then
            SERVER="${{ env.REGISTRY_NAME }}.azurecr.io"
          fi
          IMAGE_TAG="${SERVER}/${{ env.IMAGE_NAME }}:${COMMIT_SHA}"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Target deployment image: $IMAGE_TAG"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set container image on App Service
        run: |
          az webapp config container set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ steps.img.outputs.image }}

      - name: Update APP_VERSION app-setting
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "master" ]; then
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
            if [ -z "$COMMIT_SHA" ]; then
              COMMIT_SHA="${{ github.sha }}"
            fi
            VERSION=$(echo "$COMMIT_SHA" | cut -c1-7)
          fi
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings APP_VERSION=$VERSION

      - name: Show deployment info
        run: |
          echo "Deployed image: ${{ steps.img.outputs.image }}"
          az webapp show -g ${{ env.AZURE_RESOURCE_GROUP }} -n ${{ env.AZURE_WEBAPP_NAME }} --query state -o tsv
