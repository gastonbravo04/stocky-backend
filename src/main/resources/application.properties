spring.application.name=StockyBackend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/stocky
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.access.secret=${ACCESS_SECRET:dev-access-secret-which-must-be-very-long-to-be-secure}
jwt.access.expirationMs=86400000
