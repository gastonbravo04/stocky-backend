spring.application.name=StockyBackend

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stocky}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.access.secret=${ACCESS_SECRET:KzliVnJ6aHR6Q3A5Zzd3dUxQcVBoRUh3TldxTEt1em9yZ0hPbnRxZFVXaz0=}
jwt.access.expirationMs=86400000

# Gemini API Integration
gemini.api.key=${GEMINI_API_KEY:}

# Monitoreo y Metricas (Actuator)
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.enable.http.server.requests=true
management.endpoint.health.show-details=always

# 12-Factor App: Factor IX - Disposability (Apagado Seguro / Graceful Shutdown)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Silenciar arranque de librerías y mostrar solo las peticiones de Stocky
logging.level.root=WARN
logging.level.com.stocky=INFO
